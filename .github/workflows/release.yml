name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
# ubuntu-24.04-arm is not supported yet for private repositories
          - os: ubuntu-24.04
            platform: linux-arm64
#
#          - os: macos-15
#            platform: darwin-amd64

          - os: macos-latest
            platform: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install ARM64 cross-compilation toolchain (Linux ARM64)
        if: runner.os == 'Linux' && matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build release (Linux ARM64 cross-compilation)
        if: runner.os == 'Linux' && matrix.platform == 'linux-arm64'
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh ${{ steps.get_version.outputs.VERSION }}

      - name: Build release (Native build)
        if: "!(runner.os == 'Linux' && matrix.platform == 'linux-arm64')"
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh ${{ steps.get_version.outputs.VERSION }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz*

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-temp/

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find dist-temp -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} dist/ \;
          ls -lh dist/

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release assets
        run: |
          echo "Release created successfully!"
          echo "Download page: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.VERSION }}"

  sync-to-mirror:
    name: Sync Release to Mirror Repository
    needs: create-release
    runs-on: ubuntu-latest
    # Skip this job by default. Enable by setting both repository variables:
    # - MIRROR_REPO: target repository (e.g., 'username/mirror-repo')
    # - ENABLE_MIRROR_SYNC: set to 'true' to enable syncing
    if: vars.ENABLE_MIRROR_SYNC == 'true' && vars.MIRROR_REPO != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-temp/

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find dist-temp -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} dist/ \;

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: List artifacts
        run: |
          echo "Artifacts to sync:"
          ls -lh dist/

      - name: Sync to mirror repository
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          repository: ${{ vars.MIRROR_REPO }}
        env:
          GITHUB_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}

      - name: Sync completed
        run: |
          echo "Artifacts synced successfully to ${{ vars.MIRROR_REPO }}!"
          echo "Mirror download page: https://github.com/${{ vars.MIRROR_REPO }}/releases/tag/${{ steps.get_version.outputs.VERSION }}"

