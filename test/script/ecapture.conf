server {
    listen 443 ssl http2;

    server_name local.koujue.cc;
    root    /var/www/html;
    index   index.html index.htm;

    # SSL 证书配置
    ssl_certificate /etc/nginx/key/local.koujue.cc_bundle.pem;
    ssl_certificate_key /etc/nginx/key/local.koujue.cc.key;

    # TLS 版本
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    sendfile on;
    keepalive_timeout 65;

    # 文件上传大小限制 (10M)
    client_max_body_size 10m;
    client_body_buffer_size 10m;

    # 上传文件临时目录
    client_body_temp_path /tmp/nginx_uploads;

    # ==================== 基础测试端点 ====================

    # 根路径 - 简单 GET
    location = / {
        add_header Content-Type text/plain;
        add_header X-Protocol $server_protocol;
        return 200 "Hello TLS! Protocol: $server_protocol\n";
    }

    # JSON 响应
    location = /api/info {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","protocol":"$server_protocol","server":"nginx"}';
    }

    # 带参数的 GET
    location = /api/echo {
        add_header Content-Type application/json;
        return 200 '{"args":"$args","protocol":"$server_protocol"}';
    }

    # ==================== POST 测试端点 ====================

    # POST JSON/表单数据
    location = /api/post {
        # 允许所有方法
        if ($request_method = POST) {
            add_header Content-Type application/json;
            return 200 '{"received":true,"method":"POST","protocol":"$server_protocol"}';
        }
        return 405 "Method Not Allowed\n";
    }

    # ==================== 文件上传端点 ====================

    # 文件上传 (保存到磁盘)
    location /upload {
        # 上传目录
        alias /tmp/nginx_uploads/;

        # 允许的方法
        dav_methods PUT;
        create_full_put_path on;

        # POST 上传处理
        if ($request_method = POST) {
            add_header Content-Type application/json;
            return 200 '{"uploaded":true,"protocol":"$server_protocol"}';
        }
    }

    # 简化的上传端点（直接返回成功）
    location = /api/upload {
        add_header Content-Type application/json;
        return 200 '{"uploaded":true,"size":"$content_length","protocol":"$server_protocol"}';
    }

    # ==================== 下载测试端点 ====================

    # 静态文件目录
    location /files/ {
        alias /var/www/files/;
        autoindex on;
    }

    # 生成指定大小的响应（用于测试大文件）
    location ~ ^/generate/(?<size>\d+)$ {
        add_header Content-Type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="data.bin"';
        # 返回空内容，实际测试可用静态文件
        return 200;
    }

    # ==================== 特殊响应测试 ====================

    # Chunked 分块传输
    location = /chunked {
        add_header Transfer-Encoding chunked;
        add_header Content-Type text/plain;
        return 200 "Line1\nLine2\nLine3\nLine4\nLine5\n";
    }

    # Gzip 压缩响应
    location = /gzip {
        gzip on;
        gzip_min_length 0;
        gzip_types text/plain application/json;
        add_header Content-Type text/plain;
        return 200 "This is a test response that should be compressed with gzip encoding for testing purposes.\n";
    }

    # 重定向测试
    location = /redirect {
        return 302 /api/info;
    }

    location = /redirect301 {
        return 301 /api/info;
    }

    # 各种状态码
    location = /status/200 { return 200 "OK\n"; }
    location = /status/201 { return 201 "Created\n"; }
    location = /status/204 { return 204; }
    location = /status/400 { return 400 "Bad Request\n"; }
    location = /status/401 { return 401 "Unauthorized\n"; }
    location = /status/403 { return 403 "Forbidden\n"; }
    location = /status/404 { return 404 "Not Found\n"; }
    location = /status/500 { return 500 "Internal Server Error\n"; }

    # ==================== WebSocket 端点 ====================

    # WebSocket 代理（连接到后端 WS 服务）
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # WebSocket Echo 服务（如果有内置模块）
    location /ws-echo {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ==================== Headers 测试 ====================

    # 返回请求头信息
    location = /headers {
        add_header Content-Type text/plain;
        return 200 "Host: $host\nUser-Agent: $http_user_agent\nAccept: $http_accept\nProtocol: $server_protocol\n";
    }

    # 设置自定义响应头
    location = /custom-headers {
        add_header X-Custom-Header "test-value";
        add_header X-Protocol $server_protocol;
        add_header X-Request-Id $request_id;
        add_header Content-Type application/json;
        return 200 '{"headers":"custom"}';
    }
}